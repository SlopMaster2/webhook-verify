name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MSRV 1.85 = first Rust release with edition 2024 support.
        rust: [stable, beta, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  test-nostd:
    name: test (no-default-features) (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["sendgrid,paypal", "http"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features --features ${{ matrix.features }}

  doc:
    name: docs (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
      # `--all-features` alone cannot see a link that only breaks when a
      # feature-gated item is *absent*: `ambiguous_signature_header` is behind
      # `http`, and three doc links to it from non-`http` doc contexts resolved
      # fine here while failing with `unresolved link` under
      # `--no-default-features`. Since docs.rs builds the default feature set,
      # a user reading a non-default configuration's docs would hit the broken
      # link, so the minimum configuration is documented with the same
      # `-D warnings` bar.
      - run: cargo doc --no-default-features --no-deps
      # `--no-default-features` drops both `std` and every adapter feature, so
      # it cannot see a link that breaks only when `http` is *present* while
      # the adapter crates are absent: that configuration is the one where
      # `ambiguous_signature_header` is documented but `core::adapter_utils`'s
      # adapter-gated `VerifyError` import is not, so a bare
      # `[VerifyError::…]` link there resolves under `--all-features` and fails
      # with `unresolved link` here. It is a configuration a downstream user
      # reaches with `default-features = false, features = ["http"]`.
      - run: cargo doc --no-default-features --features http --no-deps

  clippy:
    name: clippy (-D warnings, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `--all-features` is the crate's own gate discipline, but it
        # subsumes configurations a downstream user can reach on their own,
        # and two of them were built by no job: an adapter without
        # `sendgrid`/`paypal` (`--features actix`, `--features tower`). Both
        # had a warning only that configuration could see — an unused test-only
        # import in the shared `adapter_utils`/adapter test modules, and a
        # `match_like_matches_macro` that fires once `cfg!` collapses both
        # arms of a feature-gated match to `false` (issue #335). A lint gate
        # that only ever sees one configuration cannot catch those.
        features: ["--all-features", "--features actix", "--features tower"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Stable-only on purpose: lint sets differ between toolchains, and the
      # bar this repo holds itself to (AGENTS.md §6) is defined against stable.
      # --all-targets: without it clippy lints only lib+bins and test-only
      # modules escape the gate (the class that shipped useless `&str` `.into()`
      # conversions in ripple.rs's tests).
      - run: cargo clippy ${{ matrix.features }} --all-targets -- -D warnings

  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # fuzz/ is a separate package, not a workspace member, so the root
      # `cargo fmt --all` above never sees it — its fmt drift was invisible
      # to this gate. Check it explicitly so the fuzz target is held to the
      # same formatting bar as the crate itself (spans don't need nightly;
      # rustfmt runs without building or resolving the libfuzzer dependency).
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

  secret-leak-grep:
    name: no secret material in logs/panics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # spec.md §6 / §4.3: the `Secret` type's redacted Debug/Display are the
      # primary defense; this grep is the backstop. src/ must contain no
      # printing or logging macros at all — the grep covers all of `src/`,
      # including `#[cfg(test)]` test modules, and there is deliberately no
      # allowlist (spec.md §6: the only acceptable releases are the
      # Secret/VerifyError/VerifyOptions redaction impls themselves).
      - name: Fail on printing/logging macros in src/
        run: |
          if grep -RInE '(println|print|eprintln|eprint|dbg)!|(log|tracing)::' src/; then
            echo "::error::printing/logging macro found in src/ — secret material must never reach logs or panics (spec.md §4.3)"
            exit 1
          fi

  cargo-audit:
    name: cargo audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    # Blocking (issue #41): scans the committed Cargo.lock (library crate
    # pattern, issue #40) against the RustSec advisory database. The three
    # current advisories — RUSTSEC-2023-0071 (rsa, no patched release, does
    # not apply to this crate's public-key-only PayPal path), RUSTSEC-2026-0009
    # (time, fix needs Rust 1.88 > MSRV 1.85, actix stack only), and
    # RUSTSEC-2026-0258 (h2, fix is the >=0.4.16 major bump, actix stack only)
    # — are deliberately ignored in .cargo/audit.toml with per-entry
    # justifications and re-evaluation triggers. Any *new* advisory still
    # fails this job and must be triaged. Cargo.lock is committed so this job
    # audits the same tree CI builds; no generate-lockfile step is needed.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  semver-checks:
    name: semver-checks
    runs-on: ubuntu-latest
    # Blocking as of issue #276. This job was informational with the comment
    # "no baseline until the first version publishes", but 0.1.0 *is* published
    # (crates.io, 2026-09-08), so the baseline exists and the job has been a
    # real check whose result gated nothing: #274 added a pub field to the
    # exhaustively constructible `CustomScheme` and merged with the job red. The
    # break is deliberate and pre-1.0, so it lands in 0.2.0 (a minor bump, which
    # is this crate's compatibility boundary) and the requirement is recorded in
    # `Cargo.toml`'s `[package.metadata.cargo-semver-checks.lints]`.
    # A newer cargo-semver-checks release can introduce a lint that trips on
    # unchanged code; that is a tripwire to triage — allow the specific lint
    # with a justification rather than restoring `continue-on-error`, the way
    # `.cargo/audit.toml` handles the dependency advisories.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks

  package:
    name: cargo package (publish tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The crates.io tarball is the exact artifact downstream consumers
      # install, and `cargo package` succeeds only if two things no other job
      # checks hold: (a) the packaged file list is clean — no tracked debris
      # that would ship verbatim (the class that shipped
      # `probe_ci_write_test.yml` earlier), and (b) the packaged tree
      # compiles from a clean extract. `--all-features` matches the crate's
      # own gate discipline everywhere else: every feature-gated module ships
      # in the tarball, so a default-features-only verify would hide a broken
      # feature combo that crates.io users could reach directly.
      - run: cargo package --all-features

  constant-time:
    name: constant-time assertion (informational)
    runs-on: ubuntu-latest
    # spec.md §5.7: timing tests are noisy on shared runners; run as a
    # non-blocking informational job so the constant-time guarantee gets
    # periodic empirical coverage without gating the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --all-features -- constant_time_comparison --ignored

  no-std-wasm:
    name: no_std + wasm32 build (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["sendgrid,paypal", "http"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features --features ${{ matrix.features }} --target wasm32-unknown-unknown

  no-std-riscv:
    name: no_std + riscv build (genuinely std-less)
    runs-on: ubuntu-latest
    # wasm32-unknown-unknown ships std, so the no-std-wasm job cannot prove a
    # std-less build. riscv32imac-unknown-none-elf is a bare-metal target with
    # no standard library — the "real std-less proof" described in spec.md §7.
    # Two builds: pure core (no features) catches regressions in the core
    # verification path; core + sendgrid is the documented no_std scope.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features --target riscv32imac-unknown-none-elf
      - run: cargo build --no-default-features --features sendgrid --target riscv32imac-unknown-none-elf
