name: Fuzz

on:
  pull_request:
  schedule:
    # Nightly; the timed run below only executes on this event.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo fuzz (build-only on PRs, timed run nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libFuzzer targets require a nightly toolchain.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Build fuzz target (every PR)
        run: cargo fuzz build --target x86_64-unknown-linux-gnu -O
      - name: Timed fuzz run (nightly only)
        if: github.event_name == 'schedule'
        run: >
          cargo fuzz run parse_and_verify --target x86_64-unknown-linux-gnu -O -- -max_total_time=600
          -rss_limit_mb=2560 -print_final_stats=1
